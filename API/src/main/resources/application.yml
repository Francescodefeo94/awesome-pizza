spring:
  datasource:
      url: jdbc:h2:mem:awesome_pizza_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    url: /api-docs/v1/openapi.yml
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

